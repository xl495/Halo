[package]
name = "halo"
version = "1.0.2"
description = "Floating countdown timer"
authors = ["Halo"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "halo_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
