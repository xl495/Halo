name: Package desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "electron/**"
      - "src/**"
      - "desktop.html"
      - "vite.desktop.config.ts"
      - "package.json"
      - ".github/workflows/package.yml"
      - "build/**"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pack: --mac dmg zip
          - os: windows-latest
            pack: --win nsis zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm install --save-dev electron@35.7.5 electron-builder@26.0.12 @resvg/resvg-js
      - name: Rasterize icon
        run: node scripts/make-icon.mjs
      - run: npx vite build --config vite.desktop.config.ts
      - env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.pack }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.yml
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Halo 1.0.0
          body: |
            Halo 悬浮倒计时桌面版。

            - **Mac**：下载 `Halo-1.0.0-mac.zip` 或 `.dmg`。第一次打开请右键 → 打开（未签名）。
            - **Windows**：下载安装包 `.exe`，若 SmartScreen 拦截选「仍要运行」。

            圆环可拖到桌面任意位置，始终置顶。托盘图标可重新打开设置。
          files: dist/**
          make_latest: true
