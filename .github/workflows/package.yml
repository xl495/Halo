name: Package desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "electron/**"
      - "desktop.html"
      - "vite.desktop.config.ts"
      - "package.json"
      - ".github/workflows/package.yml"
      - "scripts/make-icon.mjs"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm install
      - run: npm install @tauri-apps/api
      - run: npm install --save-dev @tauri-apps/cli @resvg/resvg-js
      - name: Rasterize icon
        run: node scripts/make-icon.mjs
      - name: Generate Tauri icons
        run: npx tauri icon build/icon.png
      - name: Build Tauri
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: Halo-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: Halo 1.0.6
          body: |
            Halo 悬浮倒计时，Tauri 桌面版（体积比 Electron 小一个数量级）。

            - **Mac**（Apple Silicon）：下载 `.dmg`。第一次打开请右键 → 打开。
            - **Windows**：下载 NSIS 安装包 `.exe`。若 SmartScreen 拦截选「仍要运行」。

            圆环始终置顶，托盘图标可打开设置。
          files: dist/**
          make_latest: true
